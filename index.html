<html lang="hi">
<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#2563eb" id="metaThemeColor" />

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%231d4ed8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='128' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' font-family='system-ui,-apple-system,sans-serif' font-weight='900' font-size='160' fill='%23ffffff' dominant-baseline='central' text-anchor='middle'%3EAXT%3C/text%3E%3C/svg%3E" />

  <!-- Dynamic Inline Web App Manifest -->

  <!-- Offline Libraries for Visualization & Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
      --danger: #ef4444;
      --success: #10b981;
      --card-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      --bg: #0b0f19;
      --surface: #141c2e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --primary: #3b82f6;
      --primary-gradient: linear-gradient(135deg, #60a5fa, #2563eb);
      --card-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 95px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* App Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--primary-gradient);
      color: #fff;
      font-weight: 900;
      font-size: 0.9rem;
      padding: 5px 9px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--card-shadow);
    }

    /* Overview Highlights */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary-gradient);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .stat-val {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 4px;
    }

    /* Inputs */
    .form-group { margin-bottom: 10px; }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      user-select: text;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-success { background: var(--success); color: #fff; }

    /* Expenses List */
    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .expense-item:last-child { border-bottom: none; }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 6px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    /* Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
      margin-top: 10px;
    }

    .cal-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 0;
    }

    .cal-day {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
      cursor: pointer;
      background: var(--surface);
    }

    .cal-day-expense {
      font-size: 0.58rem;
      color: var(--danger);
      font-weight: 800;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Bottom Floating Voice Mic */
    .floating-mic-container {
      position: fixed;
      bottom: 68px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 100;
    }

    .floating-mic-btn {
      pointer-events: auto;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      background: var(--primary-gradient);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .floating-mic-btn.listening {
      background: var(--danger);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); }
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      display: none;
      z-index: 200;
      text-align: center;
      max-width: 90%;
    }

    /* Bottom Navigation Bar */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 90;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.72rem;
      gap: 4px;
      cursor: pointer;
      flex: 1;
    }

    .nav-btn.active { color: var(--primary); font-weight: 700; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body data-theme="light">

  <header>
    <div class="brand">
      <div class="brand-badge">AXT</div>
      <h1>Ab's Xpense Tracker</h1>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
      <i class="fa-solid fa-moon"></i>
    </button>
  </header>

  <div id="toast" class="toast">Expense Added!</div>

  <div class="container">
    
    <!-- Tab 1: Home Dashboard -->
    <div id="tab-home" class="tab-content active">
      <div class="summary-grid">
        <div class="stat-card">
          <div class="stat-label">Total Spent</div>
          <div class="stat-val" id="totalSpent">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Budget</div>
          <div class="stat-val" id="totalBudget">₹0</div>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size: 0.95rem; margin-bottom: 12px; font-weight: 700;">Add Expense</h3>
        <form id="expenseForm" onsubmit="addManualExpense(event)">
          <div class="form-group">
            <input type="text" id="expDesc" placeholder="Item Name (e.g., Petrol, Grocery, Dinner)" required />
          </div>
          <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <input type="number" id="expAmount" placeholder="Amount (₹)" required />
            <select id="expCategory"></select>
          </div>
          <div class="form-group">
            <input type="date" id="expDate" required />
          </div>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Expense</button>
        </form>
      </div>

      <div class="card">
        <h3 style="font-size: 0.95rem; margin-bottom: 12px; font-weight: 700;">Recent Expenses</h3>
        <div id="recentExpenseList"></div>
      </div>
    </div>

    <!-- Tab 2: Calendar -->
    <div id="tab-calendar" class="tab-content">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 id="calMonthYear" style="font-size: 1rem; font-weight: 700;">Calendar</h3>
          <div style="display: flex; gap: 8px;">
            <button class="btn-secondary" style="padding: 4px 10px; border-radius: 8px;" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="btn-secondary" style="padding: 4px 10px; border-radius: 8px;" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarDays"></div>
      </div>

      <div class="card" id="dayDetailsCard" style="display: none;">
        <h3 id="selectedDateTitle" style="font-size: 0.95rem; margin-bottom: 10px;">Day Expenses</h3>
        <div id="selectedDateExpenses"></div>
      </div>
    </div>

    <!-- Tab 3: Analytics & Export -->
    <div id="tab-analytics" class="tab-content">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 style="font-size: 1rem; font-weight: 700;">Monthly Report</h3>
          <button class="btn-success" style="padding: 6px 12px; font-size: 0.8rem; width: auto;" onclick="exportToExcel()">
            <i class="fa-solid fa-file-excel"></i> Export Excel
          </button>
        </div>
        <canvas id="expensePieChart" style="max-height: 240px;"></canvas>
      </div>

      <div class="card">
        <h3 style="font-size: 0.95rem; margin-bottom: 12px; font-weight: 700;">Category Budgets</h3>
        <div id="categoryBudgetList"></div>
      </div>
    </div>

    <!-- Tab 4: Settings & Categories -->
    <div id="tab-settings" class="tab-content">
      <div class="card">
        <h3 style="font-size: 0.95rem; margin-bottom: 12px; font-weight: 700;">Manage Categories & Budget</h3>
        <form onsubmit="addNewCategory(event)">
          <div class="form-group">
            <input type="text" id="newCatName" placeholder="Category Name (e.g. Fuel, Grocery, Rent)" required />
          </div>
          <div class="form-group">
            <input type="number" id="newCatBudget" placeholder="Monthly Budget (₹) [Optional]" />
          </div>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-folder-plus"></i> Save Category</button>
        </form>
      </div>

      <div class="card">
        <h3 style="font-size: 0.95rem; margin-bottom: 12px; font-weight: 700;">Your Categories</h3>
        <div id="categoriesSettingsList"></div>
      </div>

  </div>

  <!-- Bottom Floating Voice Mic -->
  <div class="floating-mic-container">
    <button class="floating-mic-btn" id="micBtn" onclick="toggleVoiceInput()">
      <i class="fa-solid fa-microphone"></i>
    </button>
  </div>

  <!-- Bottom Navigation -->
  <nav>
    <button class="nav-btn active" onclick="switchTab('home', this)">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-btn" onclick="switchTab('calendar', this)">
      <i class="fa-solid fa-calendar-days"></i>
      <span>Calendar</span>
    </button>
    <div style="flex: 0.8;"></div> <!-- Center spacing for Mic -->
    <button class="nav-btn" onclick="switchTab('analytics', this)">
      <i class="fa-solid fa-chart-pie"></i>
      <span>Analytics</span>
    </button>
    <button class="nav-btn" onclick="switchTab('settings', this)">
      <i class="fa-solid fa-gear"></i>
      <span>Settings</span>
    </button>
  </nav>

  <script>
    // State Initialization with 0 pre-filled dummy budgets
    let expenses = JSON.parse(localStorage.getItem('abs_expenses')) || [];
    let categories = JSON.parse(localStorage.getItem('abs_categories')) || [
      { name: 'Food & Dining', budget: 0 },
      { name: 'Fuel & Travel', budget: 0 },
      { name: 'Utilities', budget: 0 },
      { name: 'General', budget: 0 }
    ];

    let currentCalDate = new Date();
    let chartInstance = null;

    document.getElementById('expDate').value = new Date().toISOString().split('T')[0];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function saveData() {
      localStorage.setItem('abs_expenses', JSON.stringify(expenses));
      localStorage.setItem('abs_categories', JSON.stringify(categories));
      renderAll();
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      el.classList.add('active');

      if (tabId === 'analytics') renderAnalytics();
      if (tabId === 'calendar') renderCalendar();
    }

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('metaThemeColor').setAttribute('content', isDark ? '#2563eb' : '#0b0f19');
      document.getElementById('themeToggle').innerHTML = isDark ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
      if (chartInstance) renderAnalytics();
    }

    // High Precision Voice Parser for Hindi / English
    function toggleVoiceInput() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        showToast('Voice recognition not supported offline in this browser');
        return;
      }

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRec();
      recognition.lang = 'hi-IN';
      recognition.interimResults = false;

      const micBtn = document.getElementById('micBtn');
      micBtn.classList.add('listening');
      showToast('Listening... Bolna shuru karein');

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        processVoiceCommand(transcript);
      };

      recognition.onerror = () => {
        micBtn.classList.remove('listening');
        showToast('Voice recognize nahi hui. Dobara koshish karein.');
      };

      recognition.onend = () => {
        micBtn.classList.remove('listening');
      };

      recognition.start();
    }

    function processVoiceCommand(text) {
      const numbers = text.match(/\d+/g);
      if (!numbers) {
        showToast(`Heard: "${text}" (Amount detect nahi hua)`);
        return;
      }
      const amount = parseFloat(numbers[numbers.length - 1]);

      let cleanDesc = text
        .replace(new RegExp(amount, 'g'), '')
        .replace(/एड|add|रुपए|रुपये|rupees|rupaye|rs|ka|ki|ke|mein|me|ko|par|per/gi, '')
        .trim();

      if (!cleanDesc) cleanDesc = "Voice Expense";

      let matchedCat = categories[0].name;
      const lower = text.toLowerCase();
      
      for (let c of categories) {
        if (lower.includes(c.name.toLowerCase())) {
          matchedCat = c.name;
          break;
        }
      }

      if (/petrol|diesel|cng|auto|uber|ola|bus|train|travel|flight/i.test(lower)) {
        matchedCat = categories.find(c => /travel|fuel/i.test(c.name))?.name || matchedCat;
      } else if (/khana|lunch|dinner|breakfast|hotel|chai|tea|coffee|cig|cigarette|botol|pani|grocery/i.test(lower)) {
        matchedCat = categories.find(c => /food|dining|grocery/i.test(c.name))?.name || matchedCat;
      }

      const newExp = {
        id: Date.now(),
        desc: cleanDesc.charAt(0).toUpperCase() + cleanDesc.slice(1),
        amount: amount,
        category: matchedCat,
        date: new Date().toISOString().split('T')[0]
      };

      expenses.unshift(newExp);
      saveData();
      showToast(`Added: ₹${amount} for ${newExp.desc} (${matchedCat})`);
    }

    function addManualExpense(e) {
      e.preventDefault();
      const desc = document.getElementById('expDesc').value;
      const amount = parseFloat(document.getElementById('expAmount').value);
      const category = document.getElementById('expCategory').value;
      const date = document.getElementById('expDate').value;

      expenses.unshift({ id: Date.now(), desc, amount, category, date });
      document.getElementById('expDesc').value = '';
      document.getElementById('expAmount').value = '';
      saveData();
      showToast('Expense Added!');
    }

    function addNewCategory(e) {
      e.preventDefault();
      const name = document.getElementById('newCatName').value.trim();
      const budget = parseFloat(document.getElementById('newCatBudget').value) || 0;

      if (categories.find(c => c.name.toLowerCase() === name.toLowerCase())) {
        showToast('Category already exists!');
        return;
      }

      categories.push({ name, budget });
      document.getElementById('newCatName').value = '';
      document.getElementById('newCatBudget').value = '';
      saveData();
      showToast('Category Saved!');
    }

    function deleteCategory(index) {
      if (confirm('Delete this category?')) {
        categories.splice(index, 1);
        saveData();
      }
    }

    function deleteExpense(id) {
      expenses = expenses.filter(exp => exp.id !== id);
      saveData();
    }

    function renderDropdowns() {
      const select = document.getElementById('expCategory');
      select.innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    }

    function renderRecentExpenses() {
      const list = document.getElementById('recentExpenseList');
      if (expenses.length === 0) {
        list.innerHTML = `<p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 12px 0;">No expenses added yet.</p>`;
        return;
      }

      list.innerHTML = expenses.slice(0, 15).map(exp => `
        <div class="expense-item">
          <div>
            <div style="font-weight: 700; font-size: 0.95rem;">${exp.desc}</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">${exp.category} • ${exp.date}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-weight: 800; color: var(--danger);">₹${exp.amount.toLocaleString('en-IN')}</span>
            <i class="fa-solid fa-trash-can" style="color: var(--text-muted); cursor: pointer; font-size: 0.9rem;" onclick="deleteExpense(${exp.id})"></i>
          </div>
        </div>
      `).join('');
    }

    function renderCategorySettings() {
      const list = document.getElementById('categoriesSettingsList');
      list.innerHTML = categories.map((c, i) => `
        <div class="expense-item">
          <div>
            <div style="font-weight: 700;">${c.name}</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Budget: ₹${c.budget.toLocaleString('en-IN')}</div>
          </div>
          <i class="fa-solid fa-trash" style="color: var(--danger); cursor: pointer;" onclick="deleteCategory(${i})"></i>
        </div>
      `).join('');
    }

    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      
      document.getElementById('calMonthYear').innerText = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const container = document.getElementById('calendarDays');
      container.innerHTML = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="cal-header">${d}</div>`).join('');

      for (let i = 0; i < firstDay; i++) {
        container.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const formattedDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayTotal = expenses.filter(e => e.date === formattedDate).reduce((acc, curr) => acc + curr.amount, 0);

        container.innerHTML += `
          <div class="cal-day" onclick="showDayExpenses('${formattedDate}')">
            <span>${day}</span>
            ${dayTotal > 0 ? `<span class="cal-day-expense">₹${dayTotal}</span>` : ''}
          </div>
        `;
      }
    }

    function changeMonth(delta) {
      currentCalDate.setMonth(currentCalDate.getMonth() + delta);
      renderCalendar();
    }

    function showDayExpenses(date) {
      const card = document.getElementById('dayDetailsCard');
      const list = document.getElementById('selectedDateExpenses');
      const title = document.getElementById('selectedDateTitle');

      const dayList = expenses.filter(e => e.date === date);
      title.innerText = `Expenses for ${date}`;

      if (dayList.length === 0) {
        list.innerHTML = `<p style="font-size: 0.8rem; color: var(--text-muted);">No expenses recorded on this date.</p>`;
      } else {
        list.innerHTML = dayList.map(e => `
          <div class="expense-item">
            <span>${e.desc} (${e.category})</span>
            <strong style="color: var(--danger);">₹${e.amount}</strong>
          </div>
        `).join('');
      }
      card.style.display = 'block';
    }

    function renderAnalytics() {
      const currentMonthStr = new Date().toISOString().slice(0, 7);
      const monthlyExpenses = expenses.filter(e => e.date.startsWith(currentMonthStr));
      
      const catTotals = {};
      categories.forEach(c => catTotals[c.name] = 0);
      monthlyExpenses.forEach(e => {
        catTotals[e.category] = (catTotals[e.category] || 0) + e.amount;
      });

      const budgetList = document.getElementById('categoryBudgetList');
      budgetList.innerHTML = categories.map(cat => {
        const spent = catTotals[cat.name] || 0;
        const pct = cat.budget > 0 ? Math.min(100, Math.round((spent / cat.budget) * 100)) : 0;
        const color = pct > 90 ? 'var(--danger)' : 'var(--primary)';
        return `
          <div style="margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 2px;">
              <span><strong>${cat.name}</strong></span>
              <span>₹${spent.toLocaleString('en-IN')} / ₹${cat.budget.toLocaleString('en-IN')} ${cat.budget > 0 ? `(${pct}%)` : ''}</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${cat.budget > 0 ? pct : 0}%; background: ${color};"></div>
            </div>
          </div>
        `;
      }).join('');

      const ctx = document.getElementById('expensePieChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = Object.keys(catTotals).filter(k => catTotals[k] > 0);
      const dataVals = labels.map(k => catTotals[k]);

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels.length ? labels : ['No Expenses Recorded'],
          datasets: [{
            data: dataVals.length ? dataVals : [1],
            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }
        }
      });
    }

    function exportToExcel() {
      if (expenses.length === 0) {
        showToast('No data to export!');
        return;
      }
      const cleanData = expenses.map(e => ({
        Date: e.date,
        Description: e.desc,
        Category: e.category,
        "Amount (INR)": e.amount
      }));

      const worksheet = XLSX.utils.json_to_sheet(cleanData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Expenses");
      XLSX.writeFile(workbook, "Abs_Xpense_Report.xlsx");
    }

    function renderAll() {
      const total = expenses.reduce((acc, curr) => acc + curr.amount, 0);
      const budget = categories.reduce((acc, curr) => acc + (curr.budget || 0), 0);

      document.getElementById('totalSpent').innerText = `₹${total.toLocaleString('en-IN')}`;
      document.getElementById('totalBudget').innerText = `₹${budget.toLocaleString('en-IN')}`;

      renderDropdowns();
      renderRecentExpenses();
      renderCategorySettings();
    }

    renderAll();
  </script>
</body>
</html>
