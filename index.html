  <style>
    /* Base Themes Definition */
    :root {
      --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b;
      --border: #e2e8f0; --primary: #2563eb; --primary-rgb: 37, 99, 235; --danger: #ef4444; --card-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }

    [data-theme="dark"] {
      --bg: #090d16; --surface: #121a2d; --text: #f8fafc; --text-muted: #94a3b8;
      --border: #1e293b; --primary: #3b82f6; --primary-rgb: 59, 130, 246; --danger: #f87171; --card-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    [data-theme="amoled"] {
      --bg: #000000; --surface: #0a0a0a; --text: #ffffff; --text-muted: #737373;
      --border: #262626; --primary: #ffffff; --primary-rgb: 255, 255, 255; --danger: #ff453a; --card-shadow: none;
    }
    [data-theme="royalgold"] {
      --bg: #0d0b06; --surface: #17140d; --text: #fef08a; --text-muted: #a18a5b;
      --border: #382f1d; --primary: #eab308; --primary-rgb: 234, 179, 8; --danger: #f87171; --card-shadow: 0 4px 20px rgba(234,179,8,0.15);
    }
    [data-theme="champagne"] {
      --bg: #faf7f2; --surface: #ffffff; --text: #3f3931; --text-muted: #8c8275;
      --border: #ede4d8; --primary: #b58943; --primary-rgb: 181, 137, 67; --danger: #e11d48; --card-shadow: 0 4px 14px rgba(181,137,67,0.08);
    }
    [data-theme="titanium"] {
      --bg: #1e2022; --surface: #272a2e; --text: #f0f2f5; --text-muted: #8b929a;
      --border: #363b41; --primary: #94a3b8; --primary-rgb: 148, 163, 184; --danger: #fb7185; --card-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    [data-theme="emerald"] {
      --bg: #03140e; --surface: #07241b; --text: #a7f3d0; --text-muted: #34d399;
      --border: #0d4a38; --primary: #10b981; --primary-rgb: 16, 185, 129; --danger: #fb7185; --card-shadow: 0 4px 20px rgba(16,185,129,0.15);
    }
    [data-theme="forest"] {
      --bg: #f2f7f4; --surface: #ffffff; --text: #143823; --text-muted: #4e785f;
      --border: #d3e4db; --primary: #2d6a4f; --primary-rgb: 45, 106, 79; --danger: #dc2626; --card-shadow: 0 4px 14px rgba(45,106,79,0.08);
    }
    [data-theme="ruby"] {
      --bg: #140508; --surface: #240b10; --text: #fecdd3; --text-muted: #fda4af;
      --border: #4c111c; --primary: #f43f5e; --primary-rgb: 244, 63, 94; --danger: #ff453a; --card-shadow: 0 4px 20px rgba(244,63,94,0.15);
    }
    [data-theme="rosegold"] {
      --bg: #fff5f7; --surface: #ffffff; --text: #4a2835; --text-muted: #9c6b7d;
      --border: #f8d7e0; --primary: #e11d48; --primary-rgb: 225, 29, 72; --danger: #ef4444; --card-shadow: 0 4px 14px rgba(225,29,72,0.08);
    }
    [data-theme="ocean"] {
      --bg: #f0fdfa; --surface: #ffffff; --text: #134e4a; --text-muted: #2dd4bf;
      --border: #ccfbf1; --primary: #0d9488; --primary-rgb: 13, 148, 136; --danger: #ef4444; --card-shadow: 0 4px 14px rgba(13,148,136,0.08);
    }
    [data-theme="midnightblue"] {
      --bg: #050b14; --surface: #0c1524; --text: #93c5fd; --text-muted: #60a5fa;
      --border: #172a45; --primary: #38bdf8; --primary-rgb: 56, 189, 248; --danger: #f87171; --card-shadow: 0 4px 20px rgba(56,189,248,0.15);
    }
    [data-theme="nordic"] {
      --bg: #22272e; --surface: #2d333b; --text: #adbac7; --text-muted: #768390;
      --border: #444c56; --primary: #539bf5; --primary-rgb: 83, 155, 245; --danger: #e5534b; --card-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    [data-theme="cyberpunk"] {
      --bg: #080014; --surface: #140326; --text: #00ffcc; --text-muted: #ff007f;
      --border: #38075e; --primary: #ff007f; --primary-rgb: 255, 0, 127; --danger: #ff3366; --card-shadow: 0 4px 20px rgba(255,0,127,0.25);
    }
    [data-theme="desert"] {
      --bg: #faf5ee; --surface: #ffffff; --text: #593d22; --text-muted: #a67c52;
      --border: #eddccb; --primary: #c86428; --primary-rgb: 200, 100, 40; --danger: #dc2626; --card-shadow: 0 4px 14px rgba(200,100,40,0.08);
    }
    [data-theme="lavender"] {
      --bg: #fbf9fe; --surface: #ffffff; --text: #3c2a4d; --text-muted: #8b6baf;
      --border: #ece3f5; --primary: #7c3aed; --primary-rgb: 124, 58, 237; --danger: #ef4444; --card-shadow: 0 4px 14px rgba(124,58,237,0.08);
    }
    [data-theme="matrix"] {
      --bg: #020b05; --surface: #04180a; --text: #00ff66; --text-muted: #009933;
      --border: #0a3818; --primary: #00ff66; --primary-rgb: 0, 255, 102; --danger: #ff453a; --card-shadow: 0 4px 20px rgba(0,255,102,0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 95px; transition: all 0.25s ease; user-select: none; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge { background: var(--primary); color: #fff; font-weight: 900; font-size: 0.85rem; padding: 5px 9px; border-radius: 10px; letter-spacing: 0.5px; }
    .brand h1 { font-size: 1.15rem; font-weight: 800; }

    .container { max-width: 600px; margin: 0 auto; padding: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--card-shadow); }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
    .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .stat-val { font-size: 1.35rem; font-weight: 800; margin-top: 4px; }

    /* AI Box */
    .ai-box { background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.08), rgba(var(--primary-rgb), 0.02)); border: 1px dashed var(--primary); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    .ai-header { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; }

    .form-group { margin-bottom: 10px; }
    input, select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.95rem; outline: none; user-select: text; }
    input:focus, select:focus { border-color: var(--primary); }

    .btn { width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.35); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-success { background: #10b981; color: #fff; }

    .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .expense-item:last-child { border-bottom: none; }
    .shop-tag { display: inline-block; background: rgba(var(--primary-rgb), 0.12); color: var(--primary); font-size: 0.72rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-top: 3px; }
    .time-tag { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

    .progress-bar-bg { width: 100%; height: 8px; background: var(--border); border-radius: 6px; margin-top: 6px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s ease; }

    /* Category Clickable in Analytics */
    .cat-analytic-row { padding: 10px 8px; border-radius: 12px; cursor: pointer; transition: background 0.15s ease; }
    .cat-analytic-row:active { background: rgba(var(--primary-rgb), 0.08); }

    /* Theme Collapsible */
    .accordion-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 4px 0; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
    .theme-btn { padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }

    /* Calendar Grid */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; margin-top: 10px; }
    .cal-header { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); padding: 4px 0; }
    .cal-day { aspect-ratio: 1; border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.8rem; cursor: pointer; background: var(--surface); }
    .cal-day-expense { font-size: 0.58rem; color: var(--danger); font-weight: 800; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

    /* Floating Mic */
    .floating-mic-container { position: fixed; bottom: 68px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; z-index: 100; }
    .floating-mic-btn { pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; border: 4px solid var(--surface); background: var(--primary); color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 8px 20px rgba(var(--primary-rgb), 0.45); display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; }
    .floating-mic-btn.listening { background: var(--danger); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 70% { transform: scale(1.15); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); } 100% { transform: scale(1); } }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.65); display: none; align-items: flex-end; justify-content: center; z-index: 150; backdrop-filter: blur(4px); }
    .modal-content { background: var(--surface); border-top-left-radius: 24px; border-top-right-radius: 24px; width: 100%; max-width: 600px; max-height: 80vh; padding: 20px; overflow-y: auto; box-shadow: 0 -10px 25px rgba(0,0,0,0.3); }

    .toast { position: fixed; top: 65px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.3); display: none; z-index: 200; text-align: center; max-width: 90%; }

    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 90; }
    .nav-btn { background: transparent; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 0.72rem; gap: 4px; cursor: pointer; flex: 1; }
    .nav-btn.active { color: var(--primary); font-weight: 700; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body data-theme="light">

  <header>
    <div class="brand">
      <div class="brand-badge">AXT</div>
      <h1>Ab's Xpense Tracker</h1>
    </div>
  </header>

  <div id="toast" class="toast">Expense Added!</div>

  <div class="container">
    
    <div id="tab-home" class="tab-content active">
      <div class="summary-grid">
        <div class="stat-card">
          <div class="stat-label">Total Spent</div>
          <div class="stat-val" id="totalSpent">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Budget</div>
          <div class="stat-val" id="totalBudget">₹0</div>
        </div>
      </div>

      <div class="ai-box">
        <div class="ai-header">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>AI Smart Quick Add</span>
        </div>
        <form onsubmit="handleAiTextSubmit(event)" style="display: flex; gap: 8px;">
          <input type="text" id="aiInputText" placeholder="e.g., Sharma store se 150 ka tel aur sabji li" style="flex: 1;" required />
          <button type="button" class="btn btn-secondary" style="width: auto; padding: 0 14px;" onclick="toggleVoiceInput()" title="Voice Add">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <button type="submit" class="btn btn-primary" style="width: auto; padding: 0 16px;">
            <i class="fa-solid fa-bolt"></i>
          </button>
        </form>
      </div>

      <div class="card">
        <h3 style="font-size: 0.95rem; margin-bottom: 12px; font-weight: 700;">Add Expense Manually</h3>
        <form id="expenseForm" onsubmit="addManualExpense(event)">
          <div class="form-group">
            <input type="text" id="expDesc" placeholder="Item Name (e.g., Paan, Cake, Petrol)" required />
          </div>
          <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <input type="text" id="expSupplier" placeholder="Shop / Supplier Name" />
            <input type="number" id="expAmount" placeholder="Amount (₹)" required />
          </div>
          <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <select id="expCategory"></select>
            <input type="date" id="expDate" required />
          </div>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Expense</button>
        </form>
      </div>

      <div class="card">
        <h3 style="font-size: 0.95rem; margin-bottom: 12px; font-weight: 700;">Recent Expenses</h3>
        <div id="recentExpenseList"></div>
      </div>
    </div>

    <div id="tab-calendar" class="tab-content">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 id="calMonthYear" style="font-size: 1rem; font-weight: 700;">Calendar</h3>
          <div style="display: flex; gap: 8px;">
            <button class="btn-secondary" style="padding: 4px 10px; border-radius: 8px;" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="btn-secondary" style="padding: 4px 10px; border-radius: 8px;" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarDays"></div>
      </div>

      <div class="card" id="dayDetailsCard" style="display: none;">
        <h3 id="selectedDateTitle" style="font-size: 0.95rem; margin-bottom: 10px;">Day Expenses</h3>
        <div id="selectedDateExpenses"></div>
      </div>
    </div>

    <div id="tab-analytics" class="tab-content">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 style="font-size: 1rem; font-weight: 700;">Monthly Analytics</h3>
          <button class="btn-success" style="padding: 6px 12px; font-size: 0.8rem; width: auto;" onclick="exportToExcel()">
            <i class="fa-solid fa-file-excel"></i> Export Excel
          </button>
        </div>
        <canvas id="expensePieChart" style="max-height: 240px;"></canvas>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h3 style="font-size: 0.95rem; font-weight: 700;">Category Breakdown (Tap to open)</h3>
        </div>
        <div id="categoryBudgetList"></div>
      </div>
    </div>

    <div id="tab-settings" class="tab-content">
      
      <div class="card">
